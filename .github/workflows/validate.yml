name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example brief
        run: >-
          python plugins/factory-mission/skills/factory-mission/scripts/validate_brief.py
          tests/fixtures/valid-brief.md
